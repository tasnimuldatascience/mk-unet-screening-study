name: Verify published evidence

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pypdf==6.1.1
      - run: python scripts/verify_published_artifacts.py
